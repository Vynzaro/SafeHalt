[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safehalt"
version = "0.3.0"
description = "Emergency isolation and reversible file quarantine for Linux workstations"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "SafeHalt contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GLP License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
safehalt = "safehalt.cli:main"

[project.urls]
Issues = "https://github.com/Vynzaro/safehalt/issues"
Source = "https://github.com/Vynzaro/safehalt"
## Replace Vynzaro, marked as [OWNER]

[tool.setuptools.packages.find]
where = ["src"]
